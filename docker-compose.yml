services:
  mysql:
    image: mysql:8.4
    container_name: sharing-vision-database
    restart: always
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  sharing-vision-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sharing-vision-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ""
      DB_NAME: article
      PORT: "8080"
    depends_on:
      - mysql

volumes:
  mysql-data:
